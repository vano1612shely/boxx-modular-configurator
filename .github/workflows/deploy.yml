name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a cancelled run can leave
# the database migrated but the old image still serving.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects capitals; the repository name is free to have them.
      - name: Resolve image reference
        id: image
        run: |
          name=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the stack definition
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/boxx/docker-compose.yml"
          scp -i ~/.ssh/id_ed25519 deploy/nginx.conf \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/etc/nginx/sites-available/boxx"

      # The registry token is the job's own and expires with the run, so nothing
      # long-lived is left behind on the server.
      - name: Release
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/boxx

          # Carried in on stdin rather than as arguments, so the token never
          # shows up in the server's process list.
          IMAGE='${{ needs.build.outputs.image }}'
          GH_ACTOR='${{ github.actor }}'
          GH_TOKEN='${{ secrets.GITHUB_TOKEN }}'

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          # Pinned by digest-bearing tag rather than :latest, so a rollback is
          # editing one line in this file and running compose again.
          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE}|" .env
          grep -q '^APP_IMAGE=' .env || echo "APP_IMAGE=${IMAGE}" >> .env

          docker compose pull
          docker compose up -d db
          # Migrations run before the new code serves. If they fail the old
          # container is still up and the deploy stops here.
          docker compose run --rm app pnpm migrate
          docker compose up -d app

          nginx -t && systemctl reload nginx
          docker logout ghcr.io
          docker image prune -f --filter 'until=168h'
          REMOTE

      - name: Wait for it to answer
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ secrets.SSH_HOST }}/configurator" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 10
          done
          echo "The site never answered with 200. Recent container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /opt/boxx && docker compose logs --tail 80 app'
          exit 1
