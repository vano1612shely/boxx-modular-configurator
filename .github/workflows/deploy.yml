name: Deploy

on:
  push:
    branches: [main]
  # Run by hand to release what is on main again — or to reset the server: a
  # wiped database comes back migrated and, given a release that carries a
  # `boxx-data.tar.gz` made by deploy/backup-data.sh, filled with that catalogue.
  workflow_dispatch:
    inputs:
      wipe_database:
        description: 'Drop the database and migrate it from scratch. Accounts go too: the admin panel then asks for a first user.'
        type: boolean
        default: false
      data_release:
        description: 'Tag of a GitHub release carrying boxx-data.tar.gz to restore after the release. Empty keeps the catalogue as it is.'
        type: string
        default: ''

# One deploy at a time, and never cancel one halfway: a cancelled run can leave
# the database migrated but the old image still serving.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  build:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects capitals; the repository name is free to have them.
      - name: Resolve image reference
        id: image
        run: |
          name=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the stack definition
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/boxx/docker-compose.yml"
          scp -i ~/.ssh/id_ed25519 deploy/nginx.conf \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/etc/nginx/sites-available/boxx"
          scp -i ~/.ssh/id_ed25519 deploy/restore-data.sh deploy/backup-data.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/boxx/"

      - name: Fetch the catalogue to restore
        if: inputs.data_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.data_release }}" -p boxx-data.tar.gz -D /tmp --clobber
          scp -i ~/.ssh/id_ed25519 /tmp/boxx-data.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/boxx/boxx-data.tar.gz"

      # The registry token is the job's own and expires with the run, so nothing
      # long-lived is left behind on the server.
      - name: Release
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/boxx

          # Carried in on stdin rather than as arguments, so the token never
          # shows up in the server's process list.
          IMAGE='${{ needs.build.outputs.image }}'
          GH_ACTOR='${{ github.actor }}'
          GH_TOKEN='${{ secrets.GITHUB_TOKEN }}'
          WIPE='${{ inputs.wipe_database }}'
          DATA='${{ inputs.data_release }}'

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          # Pinned by digest-bearing tag rather than :latest, so a rollback is
          # editing one line in this file and running compose again.
          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE}|" .env
          grep -q '^APP_IMAGE=' .env || echo "APP_IMAGE=${IMAGE}" >> .env

          docker compose pull

          # A reset starts from an empty database directory: the migrations
          # then build the schema from the baseline, and the catalogue, if one
          # was asked for, is put back below.
          if [ "$WIPE" = "true" ]; then
            echo 'wiping the database'
            docker compose down
            rm -rf /opt/boxx/postgres/*
          fi

          docker compose up -d db
          # Migrations run before the new code serves. If they fail the old
          # container is still up and the deploy stops here.
          #
          # -T and </dev/null both matter: this whole script arrives on the
          # remote shell's stdin, and `compose run` claims stdin by default —
          # without them it swallows the rest of the script and the deploy ends
          # quietly having never restarted anything.
          docker compose run --rm -T app pnpm migrate </dev/null 2>&1 || {
            echo "pnpm migrate exited with $?"
            exit 1
          }

          # The schema has to be there before anything is served or restored —
          # and it has to be in the database the stack's own settings name, or
          # a migration that ran somewhere else reads as success here. Every
          # compose command gets </dev/null for the reason given above: one
          # without it ate the rest of this script, and the release "passed"
          # with the app never started.
          PGUSER="$(grep -E '^POSTGRES_USER=' .env | cut -d= -f2-)"
          PGDB="$(grep -E '^POSTGRES_DB=' .env | cut -d= -f2-)"
          APPDB="$(docker compose run --rm -T app node -e 'const u=new URL(process.env.DATABASE_URL);console.log(u.username+"@"+u.hostname+u.pathname)' </dev/null 2>/dev/null | tail -1)"
          echo "database: POSTGRES_USER=${PGUSER} POSTGRES_DB=${PGDB}; the app connects to ${APPDB}"
          recorded="$(docker compose exec -T db psql -At -U "$PGUSER" -d "$PGDB" -c 'select count(*) from payload_migrations' </dev/null 2>&1 || true)"
          echo "migrations recorded in ${PGDB}: ${recorded}"
          case "$recorded" in
            ''|*[!0-9]*|0)
              echo 'The schema is not in place after pnpm migrate.'
              docker compose run --rm -T app sh -c 'ls -la src/migrations' </dev/null 2>&1 || true
              docker compose logs --tail 40 db </dev/null
              exit 1
              ;;
          esac

          docker compose up -d app </dev/null

          if [ -n "$DATA" ]; then
            chmod +x restore-data.sh backup-data.sh
            ./restore-data.sh boxx-data.tar.gz </dev/null
            rm -f boxx-data.tar.gz
          fi

          nginx -t && systemctl reload nginx
          docker logout ghcr.io
          docker image prune -f --filter 'until=168h'

          # A deploy that changed nothing must not report success.
          docker compose ps --status running --services | grep -qx app || {
            echo 'app container is not running after the release'
            docker compose logs --tail 50 app
            exit 1
          }
          REMOTE

      - name: Wait for it to answer
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ secrets.SSH_HOST }}/configurator" || true)
            if [ "$code" = "200" ]; then
              echo "serving after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 10
          done
          echo "The site never answered with 200. Recent container logs:"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'cd /opt/boxx && docker compose logs --tail 80 app'
          exit 1

      # A page can render while the schema underneath it is a migration behind:
      # the first release did exactly that, and only one collection was broken.
      # Querying each one turns that into a failed deploy instead of a report
      # from whoever opens the admin panel next.
      - name: Query every collection
        run: |
          failed=0
          for collection in regions building-lines building-models exterior-options \
                            room-types furniture-tiers furniture-packages \
                            models textures images quotes users; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://${{ secrets.SSH_HOST }}/api/${collection}?limit=1&depth=0" || echo 000)
            # 401 and 403 are answers; a 5xx means the query itself broke.
            case "$code" in
              5*|000) echo "  $collection -> HTTP $code"; failed=1 ;;
              *) echo "  $collection -> HTTP $code" ;;
            esac
          done
          if [ "$failed" = "1" ]; then
            ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              'cd /opt/boxx && docker compose logs --tail 60 app'
            exit 1
          fi
