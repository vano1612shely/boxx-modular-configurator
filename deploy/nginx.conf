server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Sources run past 180 MB before optimisation, multipart framing rides on top
    # of that, and nginx defaults to 1 MB — which shows up as a 413 halfway
    # through an upload.
    client_max_body_size 512m;
    client_body_timeout 600s;

    # The upload pipeline optimises a model in-process before it answers, so the
    # request stays open far longer than a normal page.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next's dev/HMR websocket and any future server-sent events.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Safe to call immutable because every model URL the app hands out carries
    # the version it was written at: replacing a file changes the URL with it.
    location /api/models/file/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
